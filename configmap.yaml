apiVersion: v1
kind: ConfigMap
metadata:
  name: todolist-config
  labels:
    app: todolist
data:
  # Comma-separated list of allowed domains (no wildcards in production)
  ALLOWED_HOSTS: "yourdomain.com,www.yourdomain.com"
  # Set DEBUG to False in production
  DEBUG: "False"
  # Choose 'sqlite' | 'postgresql' | 'mysql'
  DB_ENGINE: "postgresql"
  # Database connection settings
  DB_HOST: "db"
  DB_PORT: "5432"
  # Comma-separated list of trusted origins for CSRF (must include protocol)
  CSRF_TRUSTED_ORIGINS: "https://yourdomain.com,https://www.yourdomain.com"
